repos:
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v4.6.0
  hooks:
  - id: trailing-whitespace
    files: (\.github/|examples/).*(yaml|yml)$
  - id: end-of-file-fixer
    files: (\.github/|examples/).*(yaml|yml)$
- repo: https://github.com/rhysd/actionlint
  rev: v1.7.7
  hooks:
  - id: actionlint
- repo: local
  hooks:
  - id: ci-local
    name: ci-local (full CI checks before push)
    entry: script/ci-local.sh
    language: system
    pass_filenames: false
    always_run: true
    stages: [pre-push]
