# Example caller: a Cloudflare Worker (e.g. an API gateway).
# Needs repo secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID.
name: Worker

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    uses: Fadil369/B.I.Lab/.github/workflows/node-ci.yml@v1
    with:
      build-script: ""

  deploy:
    needs: ci
    uses: Fadil369/B.I.Lab/.github/workflows/cloudflare-workers-deploy.yml@v1
    with:
      environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}
      dry-run: ${{ github.event_name == 'pull_request' }}
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
