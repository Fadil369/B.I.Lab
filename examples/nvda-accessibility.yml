# Example caller: run accessibility tests against the NVDA screen reader (https://www.nvaccess.org/)
name: Accessibility

on:
  pull_request:

permissions:
  contents: read

jobs:
  nvda:
    uses: Fadil369/B.I.Lab/.github/workflows/nvda-accessibility.yml@v1
    with:
      nvda-version: "2025.3.2"
      test-command: npm ci; npm run test:a11y
