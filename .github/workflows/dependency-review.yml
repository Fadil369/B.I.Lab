# BrainSAIT reusable workflow: Dependency Review (pull requests only)
# Blocks PRs that add dependencies with known vulnerabilities or disallowed licenses.
name: Dependency Review

on:
  workflow_call:
    inputs:
      fail-on-severity:
        description: low, moderate, high or critical
        type: string
        default: high
      deny-licenses:
        description: Comma-separated SPDX licenses to block
        type: string
        default: "AGPL-1.0-only, AGPL-3.0-only, AGPL-3.0-or-later, GPL-3.0-only, GPL-3.0-or-later"
      comment-summary-in-pr:
        description: always, on-failure or never
        type: string
        default: on-failure

permissions:
  contents: read

jobs:
  review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write   # PR summary comment
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          fail-on-severity: ${{ inputs.fail-on-severity }}
          deny-licenses: ${{ inputs.deny-licenses }}
          comment-summary-in-pr: ${{ inputs.comment-summary-in-pr }}
