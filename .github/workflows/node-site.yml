# BrainSAIT reusable workflow: Node site quality gate
# Install, then run caller-supplied command lists, with optional PHP and
# Playwright Chromium stages and an npm audit. Callers decide what "green" means.
name: Node Site Quality

on:
  workflow_call:
    inputs:
      node-version:
        type: string
        default: "24"
      install-command:
        type: string
        default: npm ci --include=dev
      pre-browser-commands:
        description: Newline-separated commands (build, unit tests, checks) run before any browser install
        type: string
        required: true
      php-version:
        description: PHP version (e.g. 8.3). Empty skips the PHP stage.
        type: string
        default: ""
      php-extensions:
        description: Comma-separated PHP extensions (e.g. pdo_sqlite, curl, mbstring)
        type: string
        default: ""
      php-commands:
        description: Newline-separated commands run after PHP is set up
        type: string
        default: ""
      browser-commands:
        description: Newline-separated commands that need Playwright Chromium. Empty skips the install.
        type: string
        default: ""
      audit-level:
        description: npm audit threshold (info, low, moderate, high, critical, none). Empty skips the audit.
        type: string
        default: high
      timeout-minutes:
        type: number
        default: 15

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm

      - name: Install
        env:
          INSTALL_COMMAND: ${{ inputs.install-command }}
        run: bash -eo pipefail -c "$INSTALL_COMMAND"

      - name: Build and verify
        shell: bash
        env:
          PRE_BROWSER_COMMANDS: ${{ inputs.pre-browser-commands }}
        run: |
          set -euo pipefail
          bash -euo pipefail -c "$PRE_BROWSER_COMMANDS"

      - if: inputs.php-version != ''
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ inputs.php-version }}
          extensions: ${{ inputs.php-extensions }}

      - name: PHP checks
        if: inputs.php-version != '' && inputs.php-commands != ''
        shell: bash
        env:
          PHP_COMMANDS: ${{ inputs.php-commands }}
        run: |
          set -euo pipefail
          bash -euo pipefail -c "$PHP_COMMANDS"

      - name: Install Playwright Chromium
        if: inputs.browser-commands != ''
        run: npx playwright install --with-deps chromium

      - name: Browser checks
        if: inputs.browser-commands != ''
        shell: bash
        env:
          BROWSER_COMMANDS: ${{ inputs.browser-commands }}
        run: |
          set -euo pipefail
          bash -euo pipefail -c "$BROWSER_COMMANDS"

      - name: npm audit
        if: inputs.audit-level != ''
        env:
          AUDIT_LEVEL: ${{ inputs.audit-level }}
        run: |
          case "$AUDIT_LEVEL" in
            info|low|moderate|high|critical|none)
              npm audit --include=dev --audit-level="$AUDIT_LEVEL"
              ;;
            *)
              echo "::error::Invalid audit-level '$AUDIT_LEVEL' (expected info, low, moderate, high, critical, or none)"
              exit 1
              ;;
          esac
