# BrainSAIT reusable workflow: FHIR R4 resource validation  (EXPERIMENTAL)
# Runs the official HL7 FHIR Validator over JSON/XML resources in the repo,
# optionally against Implementation Guides (e.g. NPHIES packages).
# Use it on test fixtures and example bundles only. Never commit real PHI.
name: FHIR Validate

on:
  workflow_call:
    inputs:
      path:
        description: File or directory of FHIR resources to validate
        type: string
        default: fhir
      fhir-version:
        type: string
        default: "4.0.1"
      implementation-guides:
        description: Space-separated IG package ids or URLs passed as -ig (e.g. an NPHIES package)
        type: string
        default: ""
      validator-version:
        description: HL7 validator_cli release tag, or "latest"
        type: string
        default: latest
      fail-on-error:
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Resolve validator release tag
        id: validator-tag
        env:
          VERSION: ${{ inputs.validator-version }}
        run: |
          set -euo pipefail
          if [[ ! "$VERSION" =~ ^[A-Za-z0-9._-]+$ ]]; then
            echo "::error::Invalid validator-version '$VERSION'"
            exit 1
          fi
          if [ "$VERSION" = "latest" ]; then
            effective_url=$(curl -fsSLI -o /dev/null -w '%{url_effective}' "https://github.com/hapifhir/org.hl7.fhir.core/releases/latest")
            resolved="${effective_url##*/}"
            if [ -z "$resolved" ] || [ "$resolved" = "latest" ]; then
              echo "::error::Could not resolve latest HL7 validator release tag"
              exit 1
            fi
          else
            resolved="$VERSION"
          fi
          echo "tag=$resolved" >> "$GITHUB_OUTPUT"

      - name: Cache FHIR packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.fhir
          key: fhir-packages-${{ runner.os }}-${{ inputs.fhir-version }}-${{ inputs.implementation-guides }}
          restore-keys: |
            fhir-packages-${{ runner.os }}-${{ inputs.fhir-version }}-
            fhir-packages-${{ runner.os }}-

      - name: Cache HL7 validator CLI
        id: validator-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/fhir-validator/validator_cli.jar
          key: fhir-validator-cli-${{ steps.validator-tag.outputs.tag }}

      - name: Download HL7 validator
        if: steps.validator-cache.outputs.cache-hit != 'true'
        env:
          TAG: ${{ steps.validator-tag.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p ~/.cache/fhir-validator
          url="https://github.com/hapifhir/org.hl7.fhir.core/releases/download/${TAG}/validator_cli.jar"
          curl -fsSL --retry 3 -o ~/.cache/fhir-validator/validator_cli.jar "$url"

      - name: Validate
        env:
          TARGET: ${{ inputs.path }}
          FHIR_VERSION: ${{ inputs.fhir-version }}
          IGS: ${{ inputs.implementation-guides }}
        run: |
          set -f
          read -r -a igs <<< "$IGS"
          set +f
          ig_args=()
          for ig in "${igs[@]}"; do
            ig_args+=(-ig "$ig")
          done
          target="$TARGET"
          if [[ "$target" == -* ]]; then
            target="./$target"
          fi
          set +e
          java -jar ~/.cache/fhir-validator/validator_cli.jar "$target" -version "$FHIR_VERSION" "${ig_args[@]}" -output validation-outcome.json
          status=$?
          set -e
          echo "validator exit code: $status"
          echo "status=$status" >> "$GITHUB_ENV"

      - name: Upload OperationOutcome
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fhir-validation-outcome
          path: validation-outcome.json
          if-no-files-found: ignore

      - name: Fail on validation errors
        if: inputs.fail-on-error && env.status != '0'
        run: |
          echo "::error::FHIR validation reported errors. See the fhir-validation-outcome artifact."
          exit 1
