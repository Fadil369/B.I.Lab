# Internal workflow for Fadil369/B.I.Lab: keep floating major tags (e.g. v1 -> v1.x.y)
# synchronized on semver tag pushes and ensure a GitHub Release exists with generated notes.
name: Release Tag Sync

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      tag:
        description: Semver tag to sync (e.g. v1.0.0). Leave empty to sync the latest vX.Y.Z tag.
        type: string
        default: ""

permissions:
  contents: write

jobs:
  sync-major-tag:
    name: Sync floating major tag & GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out repository with full tag history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Update floating major tag and ensure GitHub Release
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          DISPATCH_TAG: ${{ inputs.tag }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git fetch --tags --force origin

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            if [[ -n "$DISPATCH_TAG" ]]; then
              sem_tag="$DISPATCH_TAG"
            else
              sem_tag="$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n 1)"
            fi
          else
            sem_tag="$REF_NAME"
          fi

          if [[ ! "$sem_tag" =~ ^v([0-9]+)\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error title=Invalid semver tag::Expected vMAJOR.MINOR.PATCH, got '${sem_tag}'"
            exit 2
          fi
          major_tag="v${BASH_REMATCH[1]}"

          if ! target_sha="$(git rev-parse "refs/tags/${sem_tag}^{commit}" 2>/dev/null)"; then
            echo "::error title=Tag not found::Tag '${sem_tag}' does not exist in ${REPO}"
            exit 1
          fi

          # Only move the floating major tag if sem_tag is the highest release in this major line
          highest_in_major="$(git tag -l "${major_tag}.*.*" --sort=-v:refname | head -n 1)"
          if [[ -n "$highest_in_major" && "$highest_in_major" != "$sem_tag" ]]; then
            echo "::notice title=Older patch tag::${sem_tag} is older than ${highest_in_major}; keeping ${major_tag} at ${highest_in_major}."
            sync_target="$highest_in_major"
            sync_sha="$(git rev-parse "refs/tags/${highest_in_major}^{commit}")"
          else
            sync_target="$sem_tag"
            sync_sha="$target_sha"
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -fa "$major_tag" -m "B.I.Lab ${major_tag} (${sync_target})" "$sync_sha"
          git push origin "refs/tags/${major_tag}" --force

          if gh release view "$sem_tag" --repo "$REPO" >/dev/null 2>&1; then
            echo "GitHub Release ${sem_tag} already exists."
          else
            gh release create "$sem_tag" \
              --repo "$REPO" \
              --verify-tag \
              --title "$sem_tag" \
              --generate-notes
          fi

          rel_url="$(gh release view "$sem_tag" --repo "$REPO" --json url --jq '.url')"
          {
            echo "## Release Tag Sync"
            echo
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Semver tag | \`${sem_tag}\` (\`${target_sha::12}\`) |"
            echo "| Floating major tag | \`${major_tag}\` -> \`${sync_target}\` (\`${sync_sha::12}\`) |"
            echo "| GitHub Release | ${rel_url} |"
          } >> "$GITHUB_STEP_SUMMARY"
