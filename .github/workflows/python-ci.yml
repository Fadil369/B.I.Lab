# BrainSAIT reusable workflow: Python / FastAPI CI
# Ruff lint + format check, mypy type-check, pytest with coverage.
name: Python CI

on:
  workflow_call:
    inputs:
      python-version:
        description: Python version
        type: string
        default: "3.12"
      working-directory:
        description: Directory holding pyproject.toml / requirements.txt
        type: string
        default: "."
      install-command:
        description: Command that installs the project and its dev tools
        type: string
        default: pip install -r requirements.txt -r requirements-dev.txt
      run-ruff:
        type: boolean
        default: true
      run-mypy:
        type: boolean
        default: true
      mypy-target:
        description: Package or path passed to mypy
        type: string
        default: "."
      pytest-args:
        description: Extra arguments for pytest
        type: string
        default: "--cov --cov-report=xml"
      upload-coverage:
        description: Upload coverage.xml as an artifact
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  ci:
    name: Python ${{ inputs.python-version }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ inputs.python-version }}
          cache: pip

      - name: Install
        env:
          INSTALL_COMMAND: ${{ inputs.install-command }}
        run: |
          python -m pip install --upgrade pip
          bash -eo pipefail -c "$INSTALL_COMMAND"

      - name: Ruff lint
        if: inputs.run-ruff
        run: |
          pip install ruff
          ruff check --output-format=github .
          ruff format --check .

      - name: mypy
        if: inputs.run-mypy
        env:
          MYPY_TARGET: ${{ inputs.mypy-target }}
        run: |
          pip install mypy
          set -f
          read -r -a targets <<< "$MYPY_TARGET"
          set +f
          if [ "${#targets[@]}" -eq 0 ]; then
            targets=(.)
          fi
          mypy "${targets[@]}"

      - name: pytest
        env:
          PYTEST_ARGS: ${{ inputs.pytest-args }}
        run: |
          pip install pytest pytest-cov
          set -f
          read -r -a pytest_args <<< "$PYTEST_ARGS"
          set +f
          pytest "${pytest_args[@]}"

      - name: Upload coverage
        if: inputs.upload-coverage && always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-${{ inputs.python-version }}
          path: ${{ inputs.working-directory }}/coverage.xml
          if-no-files-found: ignore
          retention-days: 7
