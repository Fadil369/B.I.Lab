# BrainSAIT reusable workflow: Healthcare security scan (HIPAA / NPHIES oriented)
#
# One call runs:
#   secrets        - gitleaks over git history (or only the PR's commits)
#   dependencies   - trivy-scan.yml (fs): vulnerable packages + Dockerfile/IaC misconfig
#   image          - trivy-scan.yml (image), when image-ref is given
#   built-image    - local docker build + Trivy, when dockerfile is given instead
#   codeql         - codeql.yml with security-extended queries
#   phi            - phi-scan heuristics for possible PHI in code, fixtures and log calls
#   gate           - one stable check, "Healthcare security gate", for branch protection
#
# These checks support, but do not prove, HIPAA, PDPL or NPHIES compliance. See
# docs/healthcare-security-scan.md for what each check covers and cannot guarantee.
# Example caller: examples/healthcare-security.yml
#
# Nested library workflows are called by full path at @v1.
# Third-party actions are pinned to commit SHAs (tag in the trailing comment).
name: Healthcare Security Scan

on:
  workflow_call:
    inputs:
      run-secrets:
        description: Run the gitleaks secret scan.
        type: boolean
        default: true
      run-dependencies:
        description: Run the Trivy filesystem scan (dependencies + misconfiguration).
        type: boolean
        default: true
      run-codeql:
        description: Run CodeQL. Needs GitHub Advanced Security on private repositories.
        type: boolean
        default: true
      run-phi:
        description: Run the phi-scan heuristics.
        type: boolean
        default: true
      secrets-full-history:
        description: On push/schedule, scan the whole git history. Pull requests always scan only the PR's commits.
        type: boolean
        default: true
      trivy-severity:
        description: Trivy severities that fail the build (comma separated).
        type: string
        default: CRITICAL,HIGH
      trivy-ignore-unfixed:
        description: Do not fail on vulnerabilities that have no fixed version yet.
        type: boolean
        default: true
      image-ref:
        description: Existing container image to scan (e.g. ghcr.io/org/app:sha). Leave empty to skip.
        type: string
        default: ""
      registry-username:
        description: Username for a private registry holding image-ref.
        type: string
        default: ""
      dockerfile:
        description: Dockerfile to build locally and scan. Ignored when image-ref is set.
        type: string
        default: ""
      docker-context:
        description: Build context for dockerfile.
        type: string
        default: "."
      codeql-languages:
        description: JSON array of CodeQL languages, e.g. '["javascript-typescript","python","actions"]'.
        type: string
        default: '["actions"]'
      codeql-queries:
        description: CodeQL query suite (security-extended or security-and-quality).
        type: string
        default: security-extended
      codeql-build-mode:
        description: none or autobuild (Go and Swift need autobuild).
        type: string
        default: none
      phi-fail-on:
        description: Lowest phi-scan severity that fails the build (low, medium, high, none).
        type: string
        default: medium
      phi-config:
        description: Path to the phi-scan JSON config in the calling repository.
        type: string
        default: .phi-scan.json
      upload-sarif:
        description: Upload results to GitHub code scanning. Set false on private repos without Advanced Security.
        type: boolean
        default: true
      artifact-retention-days:
        description: Days to keep raw reports from the secrets, built-image and phi jobs as artifacts.
        type: number
        default: 90
      tools-ref:
        description: Git ref of Fadil369/B.I.Lab to load phi-scan from. Defaults to main until the v1 tag exists; pin to a tag or SHA in production.
        type: string
        default: main
    secrets:
      tools-token:
        description: Token with read access to Fadil369/B.I.Lab. Only needed while that repository is private.
        required: false
      registry-password:
        description: Password/token for the registry holding image-ref.
        required: false

permissions:
  contents: read

jobs:
  secrets:
    name: Secrets (gitleaks)
    if: inputs.run-secrets
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
      actions: read
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks (checksum-verified)
        run: |
          set -euo pipefail
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$tarball" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${tarball}"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$tarball" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" version

      - name: Scan for secrets
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          FULL_HISTORY: ${{ inputs.secrets-full-history }}
        run: |
          set -uo pipefail
          args=(git --redact --no-banner --exit-code 1
                --report-format sarif --report-path gitleaks.sarif)
          if [[ "$EVENT" == "pull_request" || "$EVENT" == "pull_request_target" ]]; then
            args+=(--log-opts "--no-merges ${BASE_SHA}..${HEAD_SHA}")
            echo "Scanning PR commits ${BASE_SHA}..${HEAD_SHA}"
          elif [[ "$FULL_HISTORY" != "true" ]]; then
            args+=(--log-opts "-1")
            echo "Scanning the latest commit only"
          else
            echo "Scanning full history"
          fi
          "$RUNNER_TEMP/gitleaks" "${args[@]}" .
          status=$?
          if [[ $status -eq 1 ]]; then
            echo "::error title=Secrets found::gitleaks found possible secrets. Rotate them first, then remove them from history."
          fi
          exit "$status"

      - name: Upload SARIF
        if: always() && inputs.upload-sarif && hashFiles('gitleaks.sarif') != ''
        uses: github/codeql-action/upload-sarif@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        with:
          sarif_file: gitleaks.sarif
          category: gitleaks

      - name: Keep report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gitleaks-report
          path: gitleaks.sarif
          if-no-files-found: ignore
          retention-days: ${{ inputs.artifact-retention-days }}

  dependencies:
    name: Dependencies and IaC
    if: inputs.run-dependencies
    uses: Fadil369/B.I.Lab/.github/workflows/trivy-scan.yml@v1
    permissions:
      contents: read
      security-events: write
      actions: read
      packages: read
    with:
      scan-type: fs
      scanners: vuln,misconfig   # secrets are covered by gitleaks above
      severity: ${{ inputs.trivy-severity }}
      ignore-unfixed: ${{ inputs.trivy-ignore-unfixed }}
      fail-on-findings: true
      upload-sarif: ${{ inputs.upload-sarif }}
      sarif-category: trivy-fs

  image:
    name: Container image
    if: inputs.image-ref != ''
    uses: Fadil369/B.I.Lab/.github/workflows/trivy-scan.yml@v1
    permissions:
      contents: read
      security-events: write
      actions: read
      packages: read
    with:
      scan-type: image
      scan-ref: ${{ inputs.image-ref }}
      severity: ${{ inputs.trivy-severity }}
      ignore-unfixed: ${{ inputs.trivy-ignore-unfixed }}
      fail-on-findings: true
      registry-username: ${{ inputs.registry-username }}
      upload-sarif: ${{ inputs.upload-sarif }}
      sarif-category: trivy-image
    secrets:
      registry-password: ${{ secrets.registry-password }}

  # A locally built image only exists on this runner, so it can't be handed to trivy-scan.yml.
  built-image:
    name: Built image (Trivy)
    if: inputs.image-ref == '' && inputs.dockerfile != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build image
        id: build
        env:
          DOCKERFILE: ${{ inputs.dockerfile }}
          CONTEXT: ${{ inputs.docker-context }}
        run: |
          set -euo pipefail
          tag="healthcare-scan-local:${GITHUB_SHA::12}"
          docker build --pull -f "$DOCKERFILE" -t "$tag" "$CONTEXT"
          echo "ref=$tag" >> "$GITHUB_OUTPUT"

      - name: Trivy report (SARIF, all severities)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ steps.build.outputs.ref }}
          scanners: vuln,secret,misconfig
          format: sarif
          output: trivy-image.sarif
          exit-code: "0"

      - name: Upload SARIF
        if: always() && inputs.upload-sarif && hashFiles('trivy-image.sarif') != ''
        uses: github/codeql-action/upload-sarif@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image

      - name: Trivy gate
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ steps.build.outputs.ref }}
          scanners: vuln,secret,misconfig
          format: table
          severity: ${{ inputs.trivy-severity }}
          ignore-unfixed: ${{ inputs.trivy-ignore-unfixed }}
          exit-code: "1"
          skip-setup-trivy: true

      - name: Keep report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: trivy-built-image-report
          path: trivy-image.sarif
          if-no-files-found: ignore
          retention-days: ${{ inputs.artifact-retention-days }}

  codeql:
    name: CodeQL
    if: inputs.run-codeql && inputs.codeql-languages != '[]'
    uses: Fadil369/B.I.Lab/.github/workflows/codeql.yml@v1
    permissions:
      contents: read
      security-events: write
      actions: read
      packages: read
    with:
      languages: ${{ inputs.codeql-languages }}
      queries: ${{ inputs.codeql-queries }}
      build-mode: ${{ inputs.codeql-build-mode }}
      upload-sarif: ${{ inputs.upload-sarif }}

  phi:
    name: Possible PHI (phi-scan)
    if: inputs.run-phi
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - name: Check out repository under test
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: src
          persist-credentials: false

      - name: Check out phi-scan
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Fadil369/B.I.Lab
          ref: ${{ inputs.tools-ref }}
          token: ${{ secrets.tools-token || github.token }}
          path: tools
          persist-credentials: false
          sparse-checkout: script/phi-scan

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Scan for possible PHI
        env:
          FAIL_ON: ${{ inputs.phi-fail-on }}
          PHI_CONFIG: ${{ inputs.phi-config }}
        run: |
          set -uo pipefail
          python tools/script/phi-scan/phi_scan.py \
            --root src \
            --config "src/${PHI_CONFIG}" \
            --fail-on "$FAIL_ON" \
            --sarif phi-scan.sarif | tee phi-scan.txt
          status=${PIPESTATUS[0]}
          {
            echo '### phi-scan'
            echo
            echo '```'
            tail -n 20 phi-scan.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [[ $status -eq 1 ]]; then
            echo "::error title=Possible PHI::phi-scan found possible PHI at or above '${FAIL_ON}'. Confirm each value is synthetic, then fix it or mark it with phi-scan:ignore <reason>."
          fi
          exit "$status"

      - name: Upload SARIF
        if: always() && inputs.upload-sarif && hashFiles('phi-scan.sarif') != ''
        uses: github/codeql-action/upload-sarif@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        with:
          sarif_file: phi-scan.sarif
          checkout_path: ${{ github.workspace }}/src
          category: phi-scan

      - name: Keep report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: phi-scan-report
          path: |
            phi-scan.sarif
            phi-scan.txt
          if-no-files-found: ignore
          retention-days: ${{ inputs.artifact-retention-days }}

  gate:
    name: Healthcare security gate
    if: always()
    needs: [secrets, dependencies, image, built-image, codeql, phi]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Summarize and enforce
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          {
            echo '## Healthcare security scan'
            echo
            echo '| Check | Result |'
            echo '|---|---|'
            echo "$RESULTS" | jq -r 'to_entries[] | "| \(.key) | \(.value.result) |"'
            echo
            echo 'Passing these checks does not by itself demonstrate HIPAA, PDPL or NPHIES compliance.'
            echo 'See docs/healthcare-security-scan.md in Fadil369/B.I.Lab for coverage and limits.'
          } >> "$GITHUB_STEP_SUMMARY"
          failed=$(echo "$RESULTS" | jq -r '[to_entries[] | select(.value.result == "failure" or .value.result == "cancelled") | .key] | join(", ")')
          if [[ -n "$failed" ]]; then
            echo "::error title=Healthcare security gate::Failed checks: $failed"
            exit 1
          fi
