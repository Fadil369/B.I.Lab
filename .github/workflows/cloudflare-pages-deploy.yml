# BrainSAIT reusable workflow: Cloudflare Pages deploy (direct upload)
# Builds a static site and uploads it with `wrangler pages deploy`.
# Pull requests get a preview deployment on their own branch alias.
name: Cloudflare Pages Deploy

on:
  workflow_call:
    inputs:
      project-name:
        description: Cloudflare Pages project name
        type: string
        required: true
      output-directory:
        description: Directory to upload after build (e.g. dist, out, public)
        type: string
        default: dist
      working-directory:
        type: string
        default: "."
      node-version:
        type: string
        default: "24"
      build-command:
        description: Build command. Empty skips install and build (plain static files).
        type: string
        default: npm ci && npm run build
      github-environment:
        type: string
        default: production
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: true
      CLOUDFLARE_ACCOUNT_ID:
        required: true
    outputs:
      deployment-url:
        value: ${{ jobs.deploy.outputs.deployment-url }}

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'pull_request' && 'preview' || inputs.github-environment }}
    permissions:
      contents: read
      deployments: write
    outputs:
      deployment-url: ${{ steps.wrangler.outputs.deployment-url }}
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ inputs.node-version }}

      - name: Build
        if: inputs.build-command != ''
        env:
          BUILD_COMMAND: ${{ inputs.build-command }}
        run: bash -eo pipefail -c "$BUILD_COMMAND"

      - name: Deploy to Cloudflare Pages
        id: wrangler
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          OUTPUT_DIR: ${{ inputs.output-directory }}
          PROJECT_NAME: ${{ inputs.project-name }}
          HEAD_REF: ${{ github.head_ref }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          branch="${HEAD_REF:-$REF_NAME}"
          output_dir="$OUTPUT_DIR"
          if [[ "$output_dir" == -* ]]; then
            output_dir="./$output_dir"
          fi
          out_dir="$RUNNER_TEMP/wrangler-output"
          mkdir -p "$out_dir"
          export WRANGLER_OUTPUT_FILE_DIRECTORY="$out_dir"
          npx --yes wrangler@4 pages deploy "$output_dir" \
            --project-name="$PROJECT_NAME" \
            --branch="$branch" | tee "$RUNNER_TEMP/wrangler.log"
          url=""
          if compgen -G "$out_dir/wrangler-output-*.json" > /dev/null; then
            url=$(jq -rs '[.[] | select(.type == "pages-deploy-detailed") | .url // empty][0] // empty' "$out_dir"/wrangler-output-*.json)
          fi
          if [ -z "$url" ]; then
            url=$(grep -Eo 'https://[a-zA-Z0-9.-]+\.pages\.dev' "$RUNNER_TEMP/wrangler.log" | head -n 1 || true)
          fi
          echo "deployment-url=$url" >> "$GITHUB_OUTPUT"
