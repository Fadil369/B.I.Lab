# BrainSAIT reusable workflow: CodeQL static analysis
# Runs GitHub CodeQL for one or more languages and uploads results to the Security tab.
name: CodeQL

on:
  workflow_call:
    inputs:
      languages:
        description: 'JSON array of CodeQL languages, e.g. ["javascript-typescript","python","actions"]'
        type: string
        default: '["javascript-typescript","python"]'
      queries:
        description: security-extended or security-and-quality
        type: string
        default: security-extended
      config-file:
        description: Optional path to a CodeQL config file in the caller repo
        type: string
        default: ""

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        language: ${{ fromJSON(inputs.languages) }}
    steps:
      - uses: actions/checkout@v4

      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: ${{ inputs.queries }}
          config-file: ${{ inputs.config-file }}

      - uses: github/codeql-action/analyze@v3
        with:
          category: /language:${{ matrix.language }}
