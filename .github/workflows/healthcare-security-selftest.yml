# Internal CI for this library (not reusable): manual end-to-end run of healthcare-security-scan.yml.
name: Healthcare security scan (self-test)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    uses: ./.github/workflows/healthcare-security-scan.yml
    permissions:
      contents: read
      security-events: write
      actions: read
      packages: read
    with:
      codeql-languages: '["actions","python"]'
