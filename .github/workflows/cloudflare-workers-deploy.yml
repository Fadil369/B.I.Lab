# BrainSAIT reusable workflow: Cloudflare Workers deploy (Wrangler)
# Installs deps, optionally runs tests, then `wrangler deploy` to the chosen environment.
name: Cloudflare Workers Deploy

on:
  workflow_call:
    inputs:
      working-directory:
        description: Directory holding wrangler.toml / wrangler.jsonc (e.g. workers/api)
        type: string
        default: "."
      environment:
        description: Wrangler environment (--env). Empty deploys the top-level config.
        type: string
        default: ""
      github-environment:
        description: GitHub Environment used for approvals and scoped secrets
        type: string
        default: production
      node-version:
        type: string
        default: "24"
      wrangler-version:
        type: string
        default: "4"
      test-script:
        description: npm script run before deploy. Empty skips tests.
        type: string
        default: test
      dry-run:
        description: Build and validate only (wrangler deploy --dry-run)
        type: boolean
        default: false
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: true
      CLOUDFLARE_ACCOUNT_ID:
        required: true
    outputs:
      deployment-url:
        description: URL reported by Wrangler
        value: ${{ jobs.deploy.outputs.deployment-url }}

permissions:
  contents: read

concurrency:
  group: cf-workers-${{ github.repository }}-${{ inputs.working-directory }}-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ !inputs.dry-run && inputs.github-environment || '' }}
    outputs:
      deployment-url: ${{ steps.wrangler.outputs.deployment-url || steps.wrangler-dry-run.outputs.deployment-url }}
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ inputs.node-version }}

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci; elif [ -f package.json ]; then npm install; fi

      - name: Test
        if: inputs.test-script != ''
        env:
          TEST_SCRIPT: ${{ inputs.test-script }}
        run: |
          if [[ "$TEST_SCRIPT" == -* ]]; then
            echo "::error::Invalid test-script '$TEST_SCRIPT'"
            exit 1
          fi
          if [ -f package.json ]; then npm run --if-present "$TEST_SCRIPT"; fi

      - id: wrangler
        if: ${{ !inputs.dry-run }}
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: ${{ inputs.working-directory }}
          wranglerVersion: ${{ inputs.wrangler-version }}
          environment: ${{ inputs.environment }}
          command: deploy

      - id: wrangler-dry-run
        if: ${{ inputs.dry-run }}
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: ${{ inputs.working-directory }}
          wranglerVersion: ${{ inputs.wrangler-version }}
          environment: ${{ inputs.environment }}
          command: deploy --dry-run
